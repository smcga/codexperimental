<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demoscene Story</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Courier New", monospace;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: rgba(0, 0, 0, 0.9);
        letter-spacing: 0.2em;
        font-size: clamp(18px, 3vw, 36px);
        text-transform: uppercase;
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="demo"></canvas>
      <div class="overlay" id="start-overlay">CLICK TO START</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
