<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demoscene AI 2022</title>
  </head>
  <body>
    <div id="app">
      <canvas id="demo"></canvas>
      <div id="start-overlay">
        <div class="start-text">CLICK TO START</div>
      </div>
      <div id="debug-panels">
        <div id="debug-overlay" class="debug-panel hidden">
          <div class="debug-title">Debug Controls</div>
          <div class="debug-row">
            <span>Time</span>
            <span id="debug-timestamp">00:00.0</span>
          </div>
          <div class="debug-row">
            <span>Intro</span>
            <button id="debug-skip-intro" type="button">Skip intro</button>
          </div>
          <div class="debug-row">
            <span>Second half</span>
            <button id="debug-skip-second-half" type="button">Skip to second half</button>
          </div>
          <label class="debug-row">
            <span>Transition</span>
            <select id="debug-transition">
              <option value="auto">Auto</option>
              <option value="fade">Fade</option>
              <option value="wipe">Wipe</option>
              <option value="slide-left">Slide Left</option>
              <option value="slide-right">Slide Right</option>
              <option value="slide-up">Slide Up</option>
              <option value="slide-down">Slide Down</option>
              <option value="iris">Iris</option>
              <option value="flash">Flash</option>
            </select>
          </label>
          <div class="debug-section">
            <div class="debug-section-title">Effects</div>
            <div id="debug-effects"></div>
          </div>
          <label class="debug-row debug-toggle">
            <input type="checkbox" id="debug-monochrome" />
            <span>Force monochrome</span>
          </label>
        </div>
        <div id="debug-flyover-panel" class="debug-panel debug-section hidden">
          <div class="debug-section-title">Flyover Controls</div>
          <div class="debug-grid">
            <label class="debug-field">
              <span>Speed</span>
              <input type="number" step="0.05" min="0" data-flyover-param="speed" />
            </label>
            <label class="debug-field">
              <span>Horizon</span>
              <input type="number" step="0.01" min="0" max="1" data-flyover-param="horizon" />
            </label>
            <label class="debug-field">
              <span>Sea Detail</span>
              <input type="number" step="0.1" min="0.5" data-flyover-param="seaDetail" />
            </label>
            <label class="debug-field">
              <span>Wave Speed</span>
              <input type="number" step="0.05" min="0" data-flyover-param="waveSpeed" />
            </label>
            <label class="debug-field">
              <span>Wave Intensity</span>
              <input type="number" step="0.05" min="0" data-flyover-param="waveIntensity" />
            </label>
            <label class="debug-field">
              <span>Island Count</span>
              <input type="number" step="1" min="1" data-flyover-param="islandCount" />
            </label>
            <label class="debug-field">
              <span>Island Seed</span>
              <input type="number" step="1" data-flyover-param="islandSeed" />
            </label>
            <label class="debug-field">
              <span>Fog</span>
              <input type="number" step="0.05" min="0" max="1" data-flyover-param="fog" />
            </label>
            <label class="debug-field">
              <span>Palette</span>
              <select data-flyover-param="palette">
                <option value="day">Day</option>
                <option value="sunset">Sunset</option>
                <option value="night">Night</option>
              </select>
            </label>
            <label class="debug-field">
              <span>Audio Reactive</span>
              <input type="number" step="0.05" min="0" max="1" data-flyover-param="audioReactive" />
            </label>
          </div>
        </div>
      </div>
      <div id="mobile-controls" aria-label="Mobile controls">
        <button id="mobile-debug" type="button" aria-label="Toggle debug panel">
          DBG
        </button>
        <button id="mobile-fullscreen" type="button" aria-label="Toggle fullscreen">
          ⛶
        </button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
