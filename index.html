<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demoscene AI</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Trebuchet MS", Arial, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 28px;
        letter-spacing: 2px;
        background: rgba(0, 0, 0, 0.85);
        text-shadow: 0 0 12px rgba(0, 255, 255, 0.6);
        cursor: pointer;
        transition: opacity 0.4s ease;
        z-index: 3;
      }
      #overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="demo"></canvas>
      <div id="overlay">CLICK TO START</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
