<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Demoscene 2022-Now</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        font-family: "Courier New", monospace;
      }
      #app {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.92);
        color: #7fffd4;
        letter-spacing: 0.2em;
        font-size: clamp(18px, 3vw, 36px);
        text-align: center;
        z-index: 5;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" width="1280" height="720"></canvas>
      <div id="startOverlay" class="overlay">CLICK TO START</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
