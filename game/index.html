<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zombie Escape</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>
  <header class="hero texture-mud" aria-label="Title screen">
    <div class="title-screen">
      <p class="eyebrow">A dark night in the old town...</p>
      <h1 class="game-title" aria-label="Zombies">
        <span class="title-word">Zombies</span>
        <span class="zombie-crawler crawler-left" aria-hidden="true">🧟‍♂️</span>
        <span class="zombie-crawler crawler-right" aria-hidden="true">🧟</span>
        <span class="zombie-crawler crawler-top" aria-hidden="true">🧟‍♀️</span>
      </h1>
      <p class="tagline">How long can you survive?</p>
      <div class="actions" role="group" aria-label="Main menu actions">
        <button
          class="btn primary zombie-held"
          type="button"
          data-action="start"
          aria-label="Start a new game"
        >
          <span class="btn-label">New Game</span>
        </button>
        <button
          class="btn secondary zombie-held"
          type="button"
          data-action="options"
          aria-label="Open game options"
        >
          <span class="btn-label">Options</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="gameplay" aria-label="Gameplay area">
      <div class="canvas-placeholder" aria-hidden="true">Game canvas coming soon</div>
    </section>
  </main>

  <section class="options-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Game options">
    <div class="modal-content">
      <header class="modal-header">
        <h2>Options</h2>
        <button class="icon-btn" type="button" data-action="close-options" aria-label="Close options">×</button>
      </header>
      <div class="modal-body">
        <p>Configure sound, difficulty, and controls here.</p>
      </div>
      <footer class="modal-footer">
        <button class="btn secondary" type="button" data-action="close-options">Close</button>
        <button class="btn primary" type="button" data-action="save-options">Save</button>
      </footer>
    </div>
  </section>

  <script src="./js/main.js"></script>
</body>
</html>
